<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UpNorth Gaming Logo</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #e9edf2; font-family: Arial, sans-serif; }
      main { width: min(1100px, calc(100vw - 48px)); }
      .card { display: grid; place-items: center; min-height: 360px; padding: 48px; border-radius: 28px; background: #f7f4ea; box-shadow: 0 24px 70px rgba(21,59,91,.12); }
      .card img { width: 100%; height: auto; }
    </style>
  </head>
  <body>
    <main>
      <section class="card"><img src="upnorth-gaming-compass-logo-ice.png" alt="UpNorth Gaming compass and controller logo with ice-capped lettering"></section>
    </main>
  </body>
</html>
