<!DOCTYPE html>
<!-- The 1200x630 link preview, images/og-image.png. It reuses the home page's
     hero markup and the real stylesheets, on the dark theme, so the preview
     can't drift from the page. Render it with the command under "Link
     preview" in the root AGENTS.md. Keep the hero copy in step with
     index.html. -->
<html lang="en">

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../styles/index-common.css">
    <link rel="stylesheet" href="../../styles/index-dark.css">
    <style>
        html,
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        .section-hero {
            display: flex;
            align-items: center;
            height: 630px;
            padding: 0;
        }

        .section-hero .container {
            width: 100%;
            max-width: none;
            padding: 0 5rem;
        }

        .hero-copy h1 {
            font-size: 4.75rem;
        }

        .tagline {
            font-size: 1.4rem;
        }
    </style>
</head>

<body>
    <section class="section-hero">
        <div class="container hero-inner">
            <div class="hero-copy">
                <p class="hero-eyebrow">Indie game studio</p>
                <h1>Games built <span>up north.</span></h1>
                <p class="tagline">We’re a two-person studio making games for mobile, console, and Board.</p>
            </div>

            <img class="hero-logo" src="../../images/logo.webp" alt="" width="720" height="746">
        </div>
    </section>
</body>

</html>
